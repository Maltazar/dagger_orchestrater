[project]
name = "dagger-orchestrator"
version = "0.1.0"
description = "Dagger.io based infrastructure orchestrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-yaml>=1.4.0",
    "pydantic>=2.10.4",
    "dagger-io>=0.15.1",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "rich>=13.9.4",
]

[tool.uv.sources]
dagger-io = { path = "sdk", editable = true }

[project.entry-points."dagger.mod"]
main_object = 'src.main:DaggerOrchestrator'

#[tool.dagger]
#base-image = "python:3.12"

[build-system]
requires = ["hatchling>=0.15.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest-cov>=6.0.0",
    "pytest>=8.3.4",
    "ruff>=0.8.4",
    "ipykernel>=6.29.5",
]

[tool.ruff]
line-length = 120
