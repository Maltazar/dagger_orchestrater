[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeline-orchestrator-example"
version = "0.1.0"
description = "Example extension for the pipeline orchestrator"
requires-python = ">=3.12"
dependencies = [
    "dagger-io==0.15.1",
    "pydantic>=2.10.4",
    "structlog>=23.1.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"] 